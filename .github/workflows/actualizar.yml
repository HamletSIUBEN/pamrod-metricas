name: Actualizar métricas

on:
  schedule:
    - cron: '0 9 * * *'   # 5:00 a. m. en República Dominicana (UTC-4)
  workflow_dispatch:       # botón "Run workflow" para actualizar al momento
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: Leer el perfil público de Instagram
        if: github.event_name != 'push'
        run: node scripts/actualizar.mjs

      - name: Guardar los datos nuevos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Métricas del $(TZ=America/Santo_Domingo date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
